<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#c41e3a" />
<title>廣運50週年慶｜智能客服</title>
<style>:root {
  --bg: #0f172a;
  --card: #ffffff;
  --primary: #c41e3a;
  --primary-dark: #9a1830;
  --text: #1e293b;
  --muted: #64748b;
  --bot-bg: #f1f5f9;
  --user-bg: linear-gradient(135deg, #c41e3a, #e11d48);
  --shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  height: 100%;
}

body {
  margin: 0;
  min-height: 100%;
  min-height: 100dvh;
  font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
  background: radial-gradient(ellipse at top, #1e3a5f 0%, var(--bg) 55%);
  color: var(--text);
  overscroll-behavior: none;
  overflow-x: hidden;
}

.page {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
}

.hero {
  text-align: center;
  color: #fff;
  margin-bottom: 12px;
  flex-shrink: 0;
}

.hero-badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 5px 12px;
  border-radius: 999px;
  margin-bottom: 8px;
}

.hero h1 {
  margin: 0 0 4px;
  font-size: clamp(1.5rem, 6vw, 2rem);
  font-weight: 700;
}

.hero-sub {
  margin: 0;
  color: rgba(255, 255, 255, 0.75);
  font-size: 0.875rem;
}

.chat-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  max-height: calc(100dvh - 132px - var(--safe-top) - var(--safe-bottom));
}

.chat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid #e2e8f0;
  background: linear-gradient(90deg, #fff7ed, #fff);
  flex-shrink: 0;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: #0a2540;
  border: 1px solid rgba(0, 102, 204, 0.28);
  display: grid;
  place-items: center;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(10, 37, 64, 0.28);
}

.avatar img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: 68% 50%;
}

.status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
}

.messages {
  flex: 1 1 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.messages .quick-replies.suggest-inline {
  align-self: flex-start;
  max-width: 100%;
  padding: 0;
  margin: 0 0 4px;
  flex-wrap: wrap;
}

.messages .quick-replies.suggest-inline button {
  font-size: 13px;
  padding: 8px 12px;
  min-height: 40px;
}

.msg {
  max-width: 90%;
  padding: 12px 14px;
  border-radius: 14px;
  line-height: 1.6;
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg.bot {
  align-self: flex-start;
  background: var(--bot-bg);
  border-bottom-left-radius: 4px;
}

.msg.user {
  align-self: flex-end;
  background: var(--user-bg);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.msg.typing {
  color: var(--muted);
  font-style: italic;
}

.msg strong {
  font-weight: 600;
}

.msg.bot a {
  color: var(--primary);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.msg.bot a:active {
  color: var(--primary-dark);
}

.bot-personality-lead {
  margin: 0 0 12px;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
}

.quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 12px 10px;
  flex-shrink: 0;
}

.quick-replies button {
  border: 1px solid #e2e8f0;
  background: #fff;
  color: var(--text);
  padding: 10px 14px;
  min-height: 44px;
  border-radius: 999px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  touch-action: manipulation;
}

.quick-replies button:active {
  border-color: var(--primary);
  color: var(--primary);
  background: #fff5f5;
}

.chat-form {
  display: flex;
  gap: 8px;
  padding: 12px;
  padding-bottom: calc(12px + var(--safe-bottom));
  border-top: 1px solid #e2e8f0;
  background: #fafafa;
  flex-shrink: 0;
}

.chat-form input {
  flex: 1;
  min-width: 0;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 16px;
  font-family: inherit;
  outline: none;
  -webkit-appearance: none;
}

.chat-form input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.15);
}

.chat-form button {
  flex-shrink: 0;
  border: none;
  background: var(--primary);
  color: #fff;
  min-width: 64px;
  min-height: 48px;
  padding: 0 18px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

.chat-form button:active:not(:disabled) {
  background: var(--primary-dark);
}

.chat-form button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.footer {
  text-align: center;
  margin-top: 10px;
  color: rgba(255, 255, 255, 0.55);
  font-size: 11px;
  line-height: 1.5;
  flex-shrink: 0;
  padding: 0 8px;
}

.footer-privacy {
  margin: 6px auto 0;
  max-width: 36em;
  color: rgba(255, 255, 255, 0.45);
  font-size: 11px;
  line-height: 1.45;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

@media (min-width: 481px) {
  .page {
    padding: 24px 16px 40px;
  }

  .hero {
    margin-bottom: 20px;
  }

  .chat-card {
    max-height: calc(100dvh - 160px - var(--safe-top) - var(--safe-bottom));
  }

  .messages {
    padding: 20px;
  }

  .quick-replies button:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: #fff5f5;
  }

  .chat-form button:hover:not(:disabled) {
    background: var(--primary-dark);
  }
}

/* --- 交通方式卡片（客服回覆內）--- */
.msg.bot.transport-msg {
  max-width: 100%;
  white-space: normal;
  padding: 10px;
  background: #fff;
}

.transport-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 8px 4px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

.transport-title {
  font-size: 22px;
  color: #333333;
  text-align: center;
  margin: 0 0 16px;
  font-weight: bold;
}

.transport-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}

.transport-card {
  background-color: #ffffff;
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  padding: 20px 16px;
  text-align: center;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.transport-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
}

.transport-icon {
  font-size: 36px;
  margin-bottom: 12px;
  line-height: 1;
}

.transport-card h3 {
  font-size: 20px;
  color: #222222;
  margin: 0 0 10px;
  font-weight: 600;
}

.transport-card p {
  font-size: 16px;
  color: #555555;
  line-height: 1.6;
  margin: 0;
  text-align: left;
}

.transport-card strong {
  color: #0066cc;
}

.transport-address {
  margin: 16px 0 0;
  font-size: 15px;
  color: #333;
  line-height: 1.6;
  text-align: center;
}

.transport-nav-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}

.transport-nav-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 14px 16px;
  border-radius: 12px;
  background: #0066cc;
  color: #fff !important;
  font-size: 17px;
  font-weight: 700;
  text-align: center;
  text-decoration: none;
  line-height: 1.3;
  box-shadow: 0 4px 10px rgba(0, 102, 204, 0.25);
  touch-action: manipulation;
}

.transport-nav-btn:active {
  background: #0052a3;
}

.transport-nav-btn-secondary {
  background: #fff;
  color: #0066cc !important;
  border: 2px solid #0066cc;
  box-shadow: none;
  font-size: 15px;
  font-weight: 600;
}

.transport-nav-btn-secondary:active {
  background: #f0f7ff;
}

.parking-section-title {
  font-size: 18px;
  color: #333333;
  margin: 20px 0 8px;
  text-align: center;
  font-weight: 700;
}

.parking-note {
  font-size: 13px;
  color: #666666;
  text-align: center;
  margin: 0 0 12px;
  line-height: 1.5;
}

.parking-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.parking-item {
  background-color: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 14px 16px;
}

.parking-item-recommended {
  border-color: #0066cc;
  background-color: #f0f7ff;
}

.parking-item-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.parking-item-header strong {
  color: #222222;
  font-size: 16px;
}

.parking-subtitle {
  font-size: 14px;
  color: #555555;
}

.parking-badge {
  font-size: 11px;
  background: #0066cc;
  color: #ffffff;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 600;
}

.parking-item p {
  font-size: 14px;
  color: #555555;
  margin: 0 0 10px;
  line-height: 1.6;
  text-align: left;
}

.parking-nav-btn {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 10px 14px;
  border-radius: 10px;
  background: #ffffff;
  color: #0066cc !important;
  border: 2px solid #0066cc;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  text-decoration: none;
  line-height: 1.3;
  touch-action: manipulation;
}

.parking-nav-btn:active {
  background: #f0f7ff;
}

@media (max-width: 480px) {
  .transport-title {
    font-size: 20px;
  }

  .transport-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<div class="page">
<header class="hero"><div class="hero-badge">50th Anniversary</div><h1>廣運50週年慶</h1><p class="hero-sub" id="event-subtitle">活動智能客服</p></header>
<main class="chat-card" aria-label="智能客服對話">

</div>

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function renderInlineMarkdown(value) {
  return escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function renderMarkdown(text) {
  return String(text || "")
    .split(/(\[[^\]]+\]\([^)]+\))/g)
    .map((part) => {
      const match = part.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      if (!match) return renderInlineMarkdown(part);
      const [, label, href] = match;
      const url = href.trim();
      const safe = /^(?:\.\/|\/|https?:\/\/)/i.test(url) ? url : "#";
      return `<a href="${escapeHtml(safe)}" rel="noopener">${renderInlineMarkdown(label)}</a>`;
    })
    .join("")
    .replace(/\n/g, "<br>");
}

function normalize(text) {
  let value = String(text || "").toLowerCase();

  Object.keys(TYPO_MAP).forEach(wrong => {
    value = value.split(wrong.toLowerCase()).join(TYPO_MAP[wrong].toLowerCase());
  });

  return value
    .replace(/[\s\u3000]+/g, "")
    .replace(/[？?！!。．，,、；;：:「」『』【】（）()《》〈〉\[\]{}]/g, "")
    .replace(/臺/g, "台");
}

function tokenize(text) {
  const normalized = normalize(text);
  const tokens = new Set();

  (normalized.match(/[\u4e00-\u9fff]{2,}/g) || []).forEach(word => {
    tokens.add(word);
    for (let i = 0; i < word.length - 1; i++) tokens.add(word.slice(i, i + 2));
    for (let i = 0; i < word.length - 2; i++) tokens.add(word.slice(i, i + 3));
  });

  (normalized.match(/[a-z0-9]+/gi) || []).forEach(word => tokens.add(word));
  return tokens;
}

function expandBySynonyms(text) {
  const norm = normalize(text);
  const intents = [];

  Object.entries(SYNONYM_MAP).forEach(([intent, words]) => {
    if (words.some(word => norm.includes(normalize(word)))) {
      intents.push(intent);
    }
  });

  return intents;
}

function levenshtein(a, b) {
  a = normalize(a);
  b = normalize(b);

  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;

  const matrix = [];

  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      matrix[i][j] =
        b.charAt(i - 1) === a.charAt(j - 1)
          ? matrix[i - 1][j - 1]
          : Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
    }
  }

  return matrix[b.length][a.length];
}

function similarity(a, b) {
  a = normalize(a);
  b = normalize(b);

  if (!a || !b) return 0;
  if (a === b) return 1;

  const maxLen = Math.max(a.length, b.length);
  return 1 - levenshtein(a, b) / maxLen;
}

function fuzzyIncludes(message, keyword) {
  const msg = normalize(message);
  const kw = normalize(keyword);

  if (!msg || !kw) return false;
  if (msg.includes(kw) || kw.includes(msg)) return true;

  if (kw.length < 3 || msg.length < 3) return false;

  if (similarity(msg, kw) >= 0.72) return true;

  for (let i = 0; i <= msg.length - kw.length; i++) {
    const part = msg.slice(i, i + kw.length);
    if (similarity(part, kw) >= 0.78) return true;
  }

  return false;
}

function scoreFaq(message, faq) {
  const normMsg = normalize(message);
  const msgTokens = tokenize(message);
  const faqIntent = faq.intent || FAQ_INTENT_MAP[faq.id] || normalize(faq.category || "");
  const detectedIntents = expandBySynonyms(message);
  const intentWords = SYNONYM_MAP[faqIntent] || [];

  let score = 0;

  if (faqIntent && detectedIntents.includes(faqIntent)) score += 12;

  if (faq.question && fuzzyIncludes(normMsg, faq.question)) score += 8;

  if (faq.category && fuzzyIncludes(normMsg, faq.category)) score += 6;

  (faq.keywords || []).forEach(kw => {
    const nKw = normalize(kw);
    if (!nKw) return;

    if (normMsg.includes(nKw)) score += 5;
    else if (fuzzyIncludes(normMsg, nKw)) score += 3;
  });

  intentWords.forEach(word => {
    if (fuzzyIncludes(normMsg, word)) score += 4;
  });

  const faqTokens = tokenize([
    faq.question,
    faq.category,
    ...(faq.keywords || []),
    ...intentWords
  ].join(" "));

  msgTokens.forEach(token => {
    if (faqTokens.has(token)) score += 1;
  });

  if (normMsg.length <= 2 && score < 10) {
    score = Math.floor(score * 0.4);
  }

  if (message.includes("榮譽價")) {
    if (faq.id === "honor-leave-how") score += 15;
    else if (faq.id === "honor-leave-unit") score -= 12;
  } else if (normMsg === "榮譽假" && faq.id === "honor-leave-how") {
    score += 8;
  } else if (normMsg === "榮譽假" && faq.id === "honor-leave-unit") {
    score -= 6;
  }

  return { faq, score };
}

function findBestFaq(message) {
  const results = KNOWLEDGE.faqs
    .map(faq => scoreFaq(message, faq))
    .sort((a, b) => b.score - a.score);

  const best = results[0];
  const second = results[1];

  console.log(
    "FAQ scoring:",
    results.slice(0, 5).map(r => ({
      id: r.faq.id,
      question: r.faq.question,
      score: r.score
    }))
  );

  if (!best || best.score < 6) {
    return { faq: null, score: best ? best.score : 0, confident: false };
  }

  const gap = second ? best.score - second.score : best.score;

  return {
    faq: best.faq,
    score: best.score,
    confident: best.score >= 10 && gap >= 3
  };
}

function getTaipeiTime() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Taipei",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date()).reduce((result, part) => {
    if (part.type !== "literal") result[part.type] = Number(part.value);
    return result;
  }, {});
  return parts;
}

function isEventDay() {
  const taipei = getTaipeiTime();

function getSuggestions(message) {
  const results = KNOWLEDGE.faqs
    .map((faq) => scoreFaq(message, faq))
    .sort((a, b) => b.score - a.score)
    .filter((item) => item.faq && item.faq.question)
    .slice(0, 3);

  if (results.length > 0 && results[0].score > 0) {
    return results.map((item) => item.faq.question);
  }

  return ["活動流程與時間安排", "活動交通方式與停車資訊？", "如何聯絡福利委員會"];
}

function answer(message) {
  const trimmed = message.trim();
  const directId = QUICK_FAQ_MAP[trimmed];
  if (directId) {
    const faq = KNOWLEDGE.faqs.find((f) => f.id === directId);
    if (faq) {
      if (faq.answerHtml) {
        return {
          faq: {
            ...faq,
            personalityLead: randomPick(BOT_PERSONALITY.greetings),
          },
          suggestions: [],
        };
      }
      return {
        faq: {
          ...faq,
          answer: decorateBotReply(faq.answer || "目前沒有資料"),
        },
        suggestions: [],
      };
    }
  }

  const text = QUICK_MAP[trimmed] || trimmed;
  const found = findBestFaq(text);

  if (found.faq && found.confident) {
    const base = found.faq;
    if (base.answerHtml) {
      return {
        faq: {
          ...base,
          personalityLead: randomPick(BOT_PERSONALITY.greetings),
        },
        suggestions: [],
      };
    }
    return {
      faq: {
        ...base,
        answer: decorateBotReply(base.answer || "目前沒有資料"),
      },
      suggestions: [],
    };
  }

  const suggestions = getSuggestions(text);

  return {
    faq: {
      id: "suggestions",
      category: "系統建議",
      question: "猜你想問",
      answer: decorateFallback(KNOWLEDGE.fallback),
    },
    suggestions,
  };
}

function addMessage(role, content, options = {}) {
  const faq = options.faq;
  const plain = options.plain === true;
  const msg = document.createElement("div");

  if (role === "bot" && faq && faq.answerHtml) {
    msg.className = "msg bot transport-msg";
    if (faq.personalityLead) {
      msg.innerHTML =
        '<p class="bot-personality-lead">' +
        renderMarkdown(faq.personalityLead) +
        "</p>" +
        faq.answerHtml;
    } else {
      msg.innerHTML = faq.answerHtml;
    }
  } else if (role === "bot") {
    msg.className = "msg bot" + (plain ? " welcome-msg" : "");
    msg.innerHTML = renderMarkdown(String(content || ""));
  } else {
    msg.className = "msg user";
    msg.textContent = content;
  }

  messagesEl.appendChild(msg);

  if (options.suggestions && options.suggestions.length) {
    const suggestWrap = document.createElement("div");
    suggestWrap.className = "quick-replies suggest-inline";

    options.suggestions.forEach((label) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = label;
      btn.addEventListener("click", () => sendMessage(label));
      suggestWrap.appendChild(btn);
    });

    messagesEl.appendChild(suggestWrap);
  }

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function getSessionId() {
  try {
    let sessionId = localStorage.getItem(LOG_STORAGE_KEY);

    if (!sessionId) {
      sessionId =
        "session_" +
        Date.now() +
        "_" +
        Math.random().toString(36).slice(2, 10);

      localStorage.setItem(LOG_STORAGE_KEY, sessionId);
    }

    return sessionId;
  } catch (error) {
    return (
      "session_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2, 10)
    );
  }
}

function getDeviceType() {
  const userAgent = navigator.userAgent || "";

  if (/ipad|tablet/i.test(userAgent)) {
    return "平板";
  }

  if (/mobile|iphone|ipod|android/i.test(userAgent)) {
    return "手機";
  }

  return "電腦";
}

function logCustomerQuestion({
  userQuestion,
  faqId = "",
  faqQuestion = "",
  matched = false,
  fallback = false,
  source = "文字輸入",
}) {
  if (!LOG_API_URL) {
    return;
  }

  const cleanQuestion = String(userQuestion || "").trim();

  if (!cleanQuestion) {
    return;
  }

  const payload = {
    timestamp: new Date().toISOString(),
    sessionId: getSessionId(),
    userQuestion: cleanQuestion.slice(0, 1000),
    faqId: String(faqId || "").slice(0, 200),
    faqQuestion: String(faqQuestion || "").slice(0, 500),
    matched: Boolean(matched),
    fallback: Boolean(fallback),
    source: String(source || "文字輸入").slice(0, 100),
    device: getDeviceType(),
    version: LOG_VERSION,
  };

  try {
    fetch(LOG_API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8",
      },
      body: JSON.stringify(payload),
      keepalive: true,
    }).catch(function (error) {
      console.warn("客服紀錄送出失敗：", error);
    });
  } catch (error) {
    console.warn("客服紀錄功能發生錯誤：", error);
  }
}

function setSendingLock(locked) {
  isSending = locked;
  if (sendBtn) sendBtn.disabled = locked;
  if (quickRepliesEl) {
    quickRepliesEl.querySelectorAll("button").forEach((btn) => {
      btn.disabled = locked;
    });
  }
}

function sendMessage(text, source = "文字輸入") {
  const trimmed = String(text || "").trim();
  if (!trimmed) return;
  if (isSending) return;

  const quickLink = QUICK_LINK_MAP[trimmed];
  if (quickLink) {
    window.location.href = quickLink;
    return;
  }

  setSendingLock(true);

  addMessage("user", trimmed);
  if (input) input.value = "";

  const typing = document.createElement("div");
  typing.className = "msg bot typing";
  typing.textContent = "正在為您查詢…";
  messagesEl.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  setTimeout(() => {
    typing.remove();

    try {
      const result = answer(trimmed);
      const faq = result.faq;

      if (!faq || faq.id === "suggestions") {
        logCustomerQuestion({
          userQuestion: trimmed,
          faqId: "",
          faqQuestion: "",
          matched: false,
          fallback: true,
          source,
        });

        if (!faq) {
          addMessage("bot", decorateFallback(KNOWLEDGE.fallback));
        } else {
          const body = faq.answerHtml ? faq.answer : faq.answer || "目前沒有資料";
          addMessage("bot", body, {
            faq: faq.answerHtml ? faq : null,
            suggestions: result.suggestions || [],
          });
        }
        return;
      }

      logCustomerQuestion({
        userQuestion: trimmed,
        faqId: faq.id || "",
        faqQuestion: faq.question || "",
        matched: true,
        fallback: false,
        source,
      });

      const body = faq.answerHtml ? faq.answer : faq.answer || "目前沒有資料";
      addMessage("bot", body, {
        faq: faq.answerHtml ? faq : null,
        suggestions: result.suggestions || [],
      });
    } catch (error) {
      console.warn("客服回答處理錯誤：", error);
      try {
        addMessage("bot", decorateFallback(KNOWLEDGE.fallback));
      } catch (e) {
        /* ignore */
      }
    } finally {
      setTimeout(() => setSendingLock(false), 350);
    }
  }, 120);
}

function bindQuickReplies(items) {
  quickRepliesEl.innerHTML = "";
  items.forEach((label) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = label;
    btn.addEventListener("click", () => sendMessage(label, "快捷按鈕"));
    quickRepliesEl.appendChild(btn);
  });
}

(function setupMobileViewport() {
  const chatCard = document.querySelector('.chat-card');
  const userInput = document.getElementById('user-input');
  if (!chatCard || !userInput) return;

  function syncChatHeight() {
    const vv = window.visualViewport;
    if (!vv) return;
    const keyboardOpen = window.innerHeight - vv.height > 80;
    if (keyboardOpen) {
      const heroH = document.querySelector('.hero')?.offsetHeight || 0;
      const footerH = document.querySelector('.footer')?.offsetHeight || 0;
      const pagePad = 24;
      const maxH = Math.max(220, vv.height - heroH - footerH - pagePad);
      chatCard.style.maxHeight = maxH + 'px';
    } else {
      chatCard.style.maxHeight = '';
    }
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncChatHeight);
    window.visualViewport.addEventListener('scroll', syncChatHeight);
  }
  userInput.addEventListener('focus', () => {
    setTimeout(() => {
      syncChatHeight();
      userInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  });
  userInput.addEventListener('blur', () => {
    setTimeout(syncChatHeight, 200);
  });
})();
