<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#c41e3a" />
<title>廣運50週年慶｜智能客服</title>
<style>:root {
  --bg: #0f172a;
  --card: #ffffff;
  --primary: #c41e3a;
  --primary-dark: #9a1830;
  --text: #1e293b;
  --muted: #64748b;
  --bot-bg: #f1f5f9;
  --user-bg: linear-gradient(135deg, #c41e3a, #e11d48);
  --shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  height: 100%;
}

body {
  margin: 0;
  min-height: 100%;
  min-height: 100dvh;
  font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
  background: radial-gradient(ellipse at top, #1e3a5f 0%, var(--bg) 55%);
  color: var(--text);
  overscroll-behavior: none;
}

.page {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
}

.hero {
  text-align: center;
  color: #fff;
  margin-bottom: 12px;
  flex-shrink: 0;
}

.hero-badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 5px 12px;
  border-radius: 999px;
  margin-bottom: 8px;
}

.hero h1 {
  margin: 0 0 4px;
  font-size: clamp(1.5rem, 6vw, 2rem);
  font-weight: 700;
}

.hero-sub {
  margin: 0;
  color: rgba(255, 255, 255, 0.75);
  font-size: 0.875rem;
}

.chat-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.chat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid #e2e8f0;
  background: linear-gradient(90deg, #fff7ed, #fff);
  flex-shrink: 0;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: #fff;
  border: 1px solid rgba(196, 30, 58, 0.18);
  display: grid;
  place-items: center;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(196, 30, 58, 0.28);
}

.avatar img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
}

.messages {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 120px;
}

.messages .quick-replies.suggest-inline {
  align-self: flex-start;
  max-width: 100%;
  padding: 0;
  margin: 0 0 4px;
  flex-wrap: wrap;
}

.messages .quick-replies.suggest-inline button {
  font-size: 13px;
  padding: 8px 12px;
  min-height: 40px;
}

.msg {
  max-width: 90%;
  padding: 12px 14px;
  border-radius: 14px;
  line-height: 1.6;
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg.bot {
  align-self: flex-start;
  background: var(--bot-bg);
  border-bottom-left-radius: 4px;
}

.msg.user {
  align-self: flex-end;
  background: var(--user-bg);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.msg.typing {
  color: var(--muted);
  font-style: italic;
}

.msg strong {
  font-weight: 600;
}

.bot-personality-lead {
  margin: 0 0 12px;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
}

.quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 12px 10px;
  flex-shrink: 0;
}

.quick-replies button {
  border: 1px solid #e2e8f0;
  background: #fff;
  color: var(--text);
  padding: 10px 14px;
  min-height: 44px;
  border-radius: 999px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  touch-action: manipulation;
}

.quick-replies button:active {
  border-color: var(--primary);
  color: var(--primary);
  background: #fff5f5;
}

.chat-form {
  display: flex;
  gap: 8px;
  padding: 12px;
  padding-bottom: calc(12px + var(--safe-bottom));
  border-top: 1px solid #e2e8f0;
  background: #fafafa;
  flex-shrink: 0;
}

.chat-form input {
  flex: 1;
  min-width: 0;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 16px;
  font-family: inherit;
  outline: none;
  -webkit-appearance: none;
}

.chat-form input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.15);
}

.chat-form button {
  flex-shrink: 0;
  border: none;
  background: var(--primary);
  color: #fff;
  min-width: 64px;
  min-height: 48px;
  padding: 0 18px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

.chat-form button:active:not(:disabled) {
  background: var(--primary-dark);
}

.chat-form button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.footer {
  text-align: center;
  margin-top: 10px;
  color: rgba(255, 255, 255, 0.55);
  font-size: 11px;
  line-height: 1.5;
  flex-shrink: 0;
  padding: 0 8px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

@media (min-width: 481px) {
  .page {
    padding: 24px 16px 40px;
  }

  .hero {
    margin-bottom: 20px;
  }

  .chat-card {
    min-height: 520px;
  }

  .messages {
    max-height: 420px;
    padding: 20px;
  }

  .quick-replies button:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: #fff5f5;
  }

  .chat-form button:hover:not(:disabled) {
    background: var(--primary-dark);
  }
}

/* --- 交通方式卡片（客服回覆內）--- */
.msg.bot.transport-msg {
  max-width: 100%;
  white-space: normal;
  padding: 10px;
  background: #fff;
}

.transport-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 8px 4px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

.transport-title {
  font-size: 22px;
  color: #333333;
  text-align: center;
  margin: 0 0 16px;
  font-weight: bold;
}

.transport-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}

.transport-card {
  background-color: #ffffff;
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  padding: 20px 16px;
  text-align: center;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.transport-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
}

.transport-icon {
  font-size: 36px;
  margin-bottom: 12px;
  line-height: 1;
}

.transport-card h3 {
  font-size: 20px;
  color: #222222;
  margin: 0 0 10px;
  font-weight: 600;
}

.transport-card p {
  font-size: 16px;
  color: #555555;
  line-height: 1.6;
  margin: 0;
  text-align: left;
}

.transport-card strong {
  color: #0066cc;
}

.transport-address {
  margin: 16px 0 0;
  font-size: 15px;
  color: #333;
  line-height: 1.6;
  text-align: center;
}

.transport-nav-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}

.transport-nav-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 14px 16px;
  border-radius: 12px;
  background: #0066cc;
  color: #fff !important;
  font-size: 17px;
  font-weight: 700;
  text-align: center;
  text-decoration: none;
  line-height: 1.3;
  box-shadow: 0 4px 10px rgba(0, 102, 204, 0.25);
  touch-action: manipulation;
}

.transport-nav-btn:active {
  background: #0052a3;
}

.transport-nav-btn-secondary {
  background: #fff;
  color: #0066cc !important;
  border: 2px solid #0066cc;
  box-shadow: none;
  font-size: 15px;
  font-weight: 600;
}

.transport-nav-btn-secondary:active {
  background: #f0f7ff;
}

@media (max-width: 480px) {
  .transport-title {
    font-size: 20px;
  }

  .transport-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<header class="hero"><div class="hero-badge">50th Anniversary</div><h1>廣運50週年慶</h1><p class="hero-sub" id="event-subtitle">智能客服 · 大量使用版</p></header>

,"09:30"],"answer":"**報到時段：09:30–10:00**（請準時，10:00 開場前完成報到）\n\n請至報到區（報到處 A／B）完成報到，並於 **10:00 開場前** 入場就座。\n\n- 現場採 **數位報到**：請出示個人專屬 **QR Code**（手機顯示即可），由工作人員掃描完成報到\n- 報到後領取 **活動護照／活動物資**（含園區地圖、餐券或餐點兌換資訊等；眷屬版本規則以現場公告為準）\n- 可領取 **辨識手環** 等現場物資（以當日實際發放為準）\n- 完成報到掃描後，可於報到處領取 **廣運50週年紀念品**（50週年紀念保溫杯；入場時領取，**非**活動結束後發放）\n- 請攜帶 **員工識別或主辦單位通知之證明文件**\n\n若有報到異常，請至服務台或洽 **廣運福利委員會** 協助。"},{"id":"passport","category":"闖關","question":"活動護照與闖關怎麼玩？","keywords":["護照","闖關","關卡","集章","蓋章","兌換","抽獎券","五大關卡","時光探險"],"answer":"**11:00–15:00** 為自由闖關＆親子活動時段（**11:30 起** 美食餐車開始供餐），請持活動護照參與。\n\n**園區體驗：**\n- **廣運50闖關**：共 **5 個關卡**，任完成 **3 關** 即可兌換小禮（品項以現場公告為準，如機械爪吊飾等）\n- **廣運時光探險**：實境解謎體驗，完成關卡流程後可依現場規則兌換（詳情見現場公告）\n- 親子手作體驗、充氣城堡（建議 **2–12 歲**）、街頭互動表演\n\n**闖關禮／兌換：** 請依活動護照集章或現場兌換區規則領取，實際品項與方式以主辦單位現場公告為準。\n\n各關位置請參考護照地圖、闖關地圖或現場立牌。"},{"id":"food","category":"餐飲","question":"餐飲怎麼安排？","keywords":["餐","吃","午餐","晚餐","餐盒","美食","攤位","飲料","素食","過敏","餐車","11:30","供餐"],"answer":"**美食餐車於 11:30 開始供餐**（自由活動時段 11:00–15:00 內）。\n\n現場規劃包含：\n- **星級餐盒**（若已預訂者，活動當日憑兌換券領取，數量有限）\n- **美食市集／餐車**：可持 **餐點兌換券** 兌換小吃、飲料等（實際攤商與品項以現場為準）\n- **飲料 BAR**（如可口可樂等，兌換規則依現場公告）\n\n餐券／兌換方式請依活動護照及現場立牌說明。\n\n若有 **素食、過敏或特殊飲食** 需求，請於報到時告知服務台（請以現場實際供應為準）。"},{"id":"kids","category":"親子手作流程","question":"親子手作與DIY流程","keywords":["手作","DIY","親子手作","親子DIY","小朋友DIY","兒童手作","手工","手作課","手作體驗","DIY活動","怎麼參加","怎麼玩","在哪玩","手作流程","親子活動","小孩活動","兒童活動","小朋友可以玩什麼","親子區","DIY流程","手作時間","手作地點","限量","500份","先到先得","怎麼報名","要排隊嗎","體驗活動","手工藝","DIY教學","兒童DIY","小孩DIY","親子體驗","做東西","可以做什麼","手作區","DIY區","家長陪同","兒童體驗","手工活動","製作活動","親子課程","小孩課程","現場DIY","小朋友手作","親子遊戲","DIY體驗","製作流程","活動DIY","創作活動","親子","小孩","兒童","氣墊","城堡","泡泡","MOMO","競賽","500","手作課程","工坊體驗","材料包","現場報名","名額限制","創作工坊","互動體驗","手作紀念品","體驗場次","成品帶回家","親自手作","手做課程","材糧包","現廠報名","名額現制","手做","親自手做","才料包","手左","做手工","小孩子活動","孫子活動","現場報名嗎","還有名額嗎","做勞作","材料費","免費體驗","手作工坊","老人手作","銀髮手作","帶孫子做","手部運動","體驗課","DIY時間"],"answer":"**11:00–15:00** 自由活動時段親子項目：\n\n- **親子手作體驗（DIY）**：**製作機械爪子** 等項目，**限量 500 份**，**先到先得**（實 function normalize(text) {
  let value = String(text || "").toLowerCase();

  Object.keys(TYPO_MAP).forEach(wrong => {
    value = value.split(wrong.toLowerCase()).join(TYPO_MAP[wrong].toLowerCase());
  });

  return value
    .replace(/[\s\u3000]+/g, "")
    .replace(/[？?！!。．，,、；;：:「」『』【】（）()《》〈〉\[\]{}]/g, "")
    .replace(/臺/g, "台");
}

function tokenize(text) {
  const normalized = normalize(text);
  const tokens = new Set();

  (normalized.match(/[\u4e00-\u9fff]{2,}/g) || []).forEach(word => {
    tokens.add(word);
    for (let i = 0; i < word.length - 1; i++) tokens.add(word.slice(i, i + 2));
    for (let i = 0; i < word.length - 2; i++) tokens.add(word.slice(i, i + 3));
  });

  (normalized.match(/[a-z0-9]+/gi) || []).forEach(word => tokens.add(word));
  return tokens;
}

function expandBySynonyms(text) {
  const norm = normalize(text);
  const intents = [];

  Object.entries(SYNONYM_MAP).forEach(([intent, words]) => {
    if (words.some(word => norm.includes(normalize(word)))) {
      intents.push(intent);
    }
  });

  return intents;
}

function levenshtein(a, b) {
  a = normalize(a);
  b = normalize(b);

  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;

  const matrix = [];

  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      matrix[i][j] =
        b.charAt(i - 1) === a.charAt(j - 1)
          ? matrix[i - 1][j - 1]
          : Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
    }
  }

  return matrix[b.length][a.length];
}

function similarity(a, b) {
  a = normalize(a);
  b = normalize(b);

  if (!a || !b) return 0;
  if (a === b) return 1;

  const maxLen = Math.max(a.length, b.length);
  return 1 - levenshtein(a, b) / maxLen;
}

function fuzzyIncludes(message, keyword) {
  const msg = normalize(message);
  const kw = normalize(keyword);

  if (!msg || !kw) return false;
  if (msg.includes(kw) || kw.includes(msg)) return true;

  if (kw.length < 3 || msg.length < 3) return false;

  if (similarity(msg, kw) >= 0.72) return true;

  for (let i = 0; i <= msg.length - kw.length; i++) {
    const part = msg.slice(i, i + kw.length);
    if (similarity(part, kw) >= 0.78) return true;
  }

  return false;
}

function scoreFaq(message, faq) {
  const normMsg = normalize(message);
  const msgTokens = tokenize(message);
  const faqIntent = faq.intent || FAQ_INTENT_MAP[faq.id] || normalize(faq.category || "");
  const detectedIntents = expandBySynonyms(message);
  const intentWords = SYNONYM_MAP[faqIntent] || [];

  let score = 0;

  if (faqIntent && detectedIntents.includes(faqIntent)) score += 12;

  if (faq.question && fuzzyIncludes(normMsg, faq.question)) score += 8;

  if (faq.category && fuzzyIncludes(normMsg, faq.category)) score += 6;

  (faq.keywords || []).forEach(kw => {
    const nKw = normalize(kw);
    if (!nKw) return;

    if (normMsg.includes(nKw)) score += 5;
    else if (fuzzyIncludes(normMsg, nKw)) score += 3;
  });

  intentWords.forEach(word => {
    if (fuzzyIncludes(normMsg, word)) score += 4;
  });

  const faqTokens = tokenize([
    faq.question,
    faq.category,
    ...(faq.keywords || []),
    ...intentWords
  ].join(" "));

  msgTokens.forEach(token => {
    if (faqTokens.has(token)) score += 1;
  });

  if (normMsg.length <= 2 && score < 10) {
    score = Math.floor(score * 0.4);
  }

  return { faq, score };
}

function findBestFaq(message) {
  const results = KNOWLEDGE.faqs
    .map(faq => scoreFaq(message, faq))
    .sort((a, b) => b.score - a.score);

  const best = results[0];
  const second = results[1];

  console.log(
    "FAQ scoring:",
    results.slice(0, 5).map(r => ({
      id: r.faq.id,
      question: r.faq.question,
      score: r.score
    }))
  );

  if (!best || best.score < 6) {
    return { faq: null, score: best ? best.score : 0, confident: false };
  }

  const gap = second ? best.score - second.score : best.score;

  return {
    faq: best.faq,
    score: best.score,
    confident: best.score >= 10 && gap >= 3
  };
}

      btn.addEventListener("click", () => sendMessage(label));
      suggestWrap.appendChild(btn);
    });

    messagesEl.appendChild(suggestWrap);
  }

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showWelcomeMessage() {
  const welcome = `您好，歡迎使用廣運50週年慶活動智能客服。

${getCountdownText()}

${getCurrentSuggestion().trim()}`;

  addMessage("bot", welcome, { plain: true });
}

function sendMessage(text) {
  const trimmed = String(text || "").trim();
  if (!trimmed) return;

  addMessage("user", trimmed);
  if (input) input.value = "";

  const typing = document.createElement("div");
  typing.className = "msg bot typing";
  typing.textContent = "正在為您查詢…";
  messagesEl.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  setTimeout(() => {
    typing.remove();

    const result = answer(trimmed);
    const faq = result.faq;

    if (!faq) {
      addMessage(
        "bot",
        decorateFallback(
          KNOWLEDGE.fallback || "目前找不到相關資訊，請洽服務台或福利委員會。"
        )
      );
      return;
    }

    const body = faq.answerHtml ? faq.answer : faq.answer || "目前沒有資料";
    addMessage("bot", body, {
      faq: faq.answerHtml ? faq : null,
      suggestions: result.suggestions || [],
    });
  }, 120);
}

function bindQuickReplies(items){quickRepliesEl.innerHTML='';items.forEach(label=>{const btn=document.createElement('button');btn.type='button';btn.textContent=label;btn.addEventListener('click',()=>sendMessage(label));quickRepliesEl.appendChild(btn)})}
form.addEventListener('submit',e=>{e.preventDefault();sendMessage(input.value)});
document.getElementById('event-subtitle').textContent = KNOWLEDGE.event.name + ' · 智能客服';
bindQuickReplies(KNOWLEDGE.quickReplies||[]);
showWelcomeMessage();
</script>
</body>
