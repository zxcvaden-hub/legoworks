<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#c41e3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="活動小幫手" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <title>廣運50週年慶｜智能客服</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero-badge">50th Anniversary</div>
        <h1>廣運50週年慶</h1>
        <p class="hero-sub" id="event-subtitle">智能客服 · 即時解答活動疑問</p>
      </header>

      <main class="chat-card" aria-label="智能客服對話">
        <div class="chat-header">
          <div class="avatar" aria-hidden="true">
            <img src="/messageImage_1779701547098.jpg" alt="" />
          </div>
          <div>
            <strong>活動小幫手</strong>
            <span class="status"><span class="dot"></span> 線上服務中</span>
          </div>
        </div>

        <div id="messages" class="messages" role="log" aria-live="polite"></div>

        <div id="quick-replies" class="quick-replies"></div>

        <form id="chat-form" class="chat-form">
          <label class="sr-only" for="user-input">輸入問題</label>
          <input
            id="user-input"
            type="text"
            enterkeyhint="send"
            placeholder="例如：活動幾點開始？"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="sentences"
            maxlength="500"
          />
          <button type="submit" id="send-btn">送出</button>
        </form>
      </main>

      <footer class="footer">
        <p>由活動知識庫驅動 · 有問題請洽「廣運福利委員會」或現場服務台</p>
      </footer>
    </div>
    <script src="/js/chat.js"></script>
  </body>
</html>
