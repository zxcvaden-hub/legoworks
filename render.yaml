# Render 一鍵部署：https://render.com
# 將本 repo 連結至 Render 後，選 New > Blueprint 或 Web Service
services:
  - type: web
    name: guangyun-50-chatbot
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "No build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
