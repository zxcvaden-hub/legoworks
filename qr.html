<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>廣運50週年慶｜QR Code</title>
<style>
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0f172a;font-family:system-ui,'Noto Sans TC',sans-serif;padding:24px;color:#1e293b}.card{background:#fff;border-radius:20px;padding:28px 24px;width:min(360px,100%);text-align:center}h1{font-size:1.25rem;margin:0 0 8px;color:#c41e3a}p{color:#64748b;line-height:1.5;margin:0 0 14px}.url{word-break:break-all;background:#f1f5f9;color:#c41e3a;font-weight:700;border-radius:10px;padding:12px;margin-top:12px}#qrcode{display:flex;justify-content:center;margin:18px 0}a{display:block;margin-top:16px;background:#c41e3a;color:#fff;text-decoration:none;border-radius:12px;padding:12px;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h1>廣運50週年慶智能客服</h1>
<p>掃描 QR Code 開啟活動客服</p>
<div id="qrcode"></div>
<div id="url" class="url"></div>
<a id="open" href="./">直接開啟</a>
</div>
<script src="./qrcode.min.js"></script>
<script>
var url = location.origin + location.pathname.replace(/\/qr\.html$/, '/') ;
document.getElementById('url').textContent = url;
document.getElementById('open').href = url;
new QRCode(document.getElementById('qrcode'), {text:url,width:220,height:220,colorDark:'#1e293b',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});
</script>
</body>
</html>
